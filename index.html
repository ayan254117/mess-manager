<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sliding Auth System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container" id="container">
    
    <!-- Sign Up Form -->
    <div class="form-container sign-up-container">
      <form id="signupForm" novalidate>
        <h1>Create Account</h1>
        <p class="subtitle">Join our community today</p>
        
        <div id="signupMessage" class="message-box"></div>

        <div class="name-row">
          <div class="input-group">
            <i class="fas fa-user icon"></i>
            <input type="text" id="firstName" placeholder="First Name" required>
          </div>
          <div class="input-group">
            <i class="fas fa-user icon"></i>
            <input type="text" id="lastName" placeholder="Last Name" required>
          </div>
        </div>

        <!-- Contact Method Selector -->
        <div class="contact-selector">
          <label><input type="radio" name="contactType" value="email" checked> Email</label>
          <label><input type="radio" name="contactType" value="phone"> Phone</label>
          <label><input type="radio" name="contactType" value="username"> Username</label>
        </div>

        <div class="input-group">
          <i class="fas fa-envelope icon" id="contactIcon"></i>
          <input type="text" id="signupContact" placeholder="Email Address" required>
          <div id="emailSuggestions" class="suggestions-list"></div>
        </div>

        <!-- DOB & Gender -->
        <div class="name-row">
          <div class="input-group">
            <i class="fas fa-calendar icon"></i>
            <input type="text" id="dobInput" placeholder="DOB (YYYY-MM-DD)" readonly required>
            <div id="dobPicker" class="dob-picker-popup"></div>
          </div>
          <div class="input-group">
            <i class="fas fa-venus-mars icon"></i>
            <select id="gender" required>
              <option value="" disabled selected>Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <!-- Password Field -->
        <div class="input-group">
          <i class="fas fa-lock icon"></i>
          <input type="password" id="signupPassword" placeholder="Password" required>
          <i class="fas fa-eye toggle-password" id="toggleSignupPassword"></i>
        </div>

        <div class="strength-meter"><div id="strengthBar"></div></div>
        <div id="capsAlert" class="caps-alert"><i class="fas fa-exclamation-triangle"></i> Caps Lock is ON</div>

        <div class="input-group">
          <i class="fas fa-lock icon"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="btn" id="signupBtn">
          <span>Sign Up</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Sign In Form -->
    <div class="form-container sign-in-container">
      <form id="signinForm" novalidate>
        <h1>Sign In</h1>
        <p class="subtitle">Welcome back! Please enter your details</p>
        
        <div id="signinMessage" class="message-box"></div>

        <div class="input-group">
          <i class="fas fa-user icon"></i>
          <input type="text" id="signinContact" placeholder="Email, Phone or Username" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock icon"></i>
          <input type="password" id="signinPassword" placeholder="Password" required>
          <i class="fas fa-eye toggle-password" id="toggleSigninPassword"></i>
        </div>

        <div class="forgot-pass">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn" id="signinBtn">
          <span>Sign In</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Overlay Panel -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>To keep connected with us please login with your personal info</p>
          <button class="btn ghost" id="signIn">Sign In</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hello, Friend!</h1>
          <p>Enter your personal details and start journey with us</p>
          <button class="btn ghost" id="signUp">Sign Up</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
